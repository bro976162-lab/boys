<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOYS - Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">

    <div class="auth-box">
      <div class="logo">BOYS</div>
      <p class="subtitle">Connect with your friends</p>

      <div class="tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="signupTab">Sign Up</button>
      </div>

      <input
        id="nameInput"
        type="text"
        placeholder="Your name"
        class="signup-only"
      >

      <input
        id="emailInput"
        type="email"
        placeholder="Email address"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="Password"
      >

      <button id="authButton" class="auth-button">
        Login
      </button>

      <p id="authMessage" class="auth-message"></p>
    </div>

  </div>


  <!-- MAIN APP -->
  <div id="app" class="app hidden">

    <aside class="sidebar">

      <div class="sidebar-header">
        <div>
          <h2>BOYS</h2>
          <span id="myStatus">Offline</span>
        </div>

        <button id="logoutButton" class="logout-btn">
          Logout
        </button>
      </div>

      <div class="my-profile">

        <div class="avatar" id="myAvatar">
          B
        </div>

        <div>
          <strong id="myName">User</strong>
          <small id="myEmail">email</small>
        </div>

      </div>


      <div class="search-box">

        <input
          id="searchInput"
          type="text"
          placeholder="Search users..."
        >

      </div>


      <div id="usersList" class="users-list">

        <p class="loading">
          Loading users...
        </p>

      </div>

    </aside>


    <main class="chat-area">

      <div id="emptyChat" class="empty-chat">

        <div class="empty-icon">
          💬
        </div>

        <h2>
          Welcome to BOYS
        </h2>

        <p>
          Select a user to start chatting.
        </p>

      </div>


      <div id="chatBox" class="chat-box hidden">

        <header class="chat-header">

          <button
            id="backButton"
            class="back-btn"
          >
            ←
          </button>

          <div
            class="chat-avatar"
            id="chatAvatar"
          >
            U
          </div>

          <div class="chat-user-info">

            <strong id="chatName">
              User
            </strong>

            <span id="chatStatus">
              Offline
            </span>

          </div>

        </header>


        <div
          id="messages"
          class="messages"
        >
        </div>


        <div class="message-area">

          <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
          >

          <button id="sendButton">
            ➤
          </button>

        </div>

      </div>

    </main>

  </div>


  <script
    type="module"
    src="boys3.js"
  ></script>

</body>
</html>
