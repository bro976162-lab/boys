<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini WhatsApp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <h2>Mini WhatsApp</h2>
                <button id="profileBtn">👤</button>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search chats..."
                >
            </div>

            <div id="chatList" class="chat-list">

                <div class="chat-user" data-name="Rahul">
                    <div class="avatar">R</div>

                    <div class="chat-info">
                        <h3>Rahul</h3>
                        <p>Hey! What's up?</p>
                    </div>

                    <span class="time">10:30</span>
                </div>

                <div class="chat-user" data-name="Amit">
                    <div class="avatar">A</div>

                    <div class="chat-info">
                        <h3>Amit</h3>
                        <p>See you tomorrow 👍</p>
                    </div>

                    <span class="time">09:15</span>
                </div>

                <div class="chat-user" data-name="Rohan">
                    <div class="avatar">R</div>

                    <div class="chat-info">
                        <h3>Rohan</h3>
                        <p>Good morning!</p>
                    </div>

                    <span class="time">Yesterday</span>
                </div>

            </div>

        </aside>


        <!-- Chat Area -->
        <main class="chat-area">

            <header class="chat-header">

                <div class="selected-avatar" id="selectedAvatar">
                    R
                </div>

                <div class="selected-user">
                    <h3 id="selectedName">Rahul</h3>
                    <p id="onlineStatus">online</p>
                </div>

                <div class="header-buttons">
                    <button>📞</button>
                    <button>⋮</button>
                </div>

            </header>


            <!-- Messages -->
            <section id="messages" class="messages">

                <div class="message received">
                    <p>Hey! 👋</p>
                    <span>10:29</span>
                </div>

                <div class="message sent">
                    <p>Hello! How are you?</p>
                    <span>10:30 ✓✓</span>
                </div>

            </section>


            <!-- Message Input -->
            <footer class="message-input">

                <button id="emojiBtn">😊</button>

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                >

                <button id="sendBtn">➤</button>

            </footer>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
